<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sri Lanka Utility Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item-active { background-color: #3b82f6; color: white !important; border-radius: 0.5rem; }
        .sidebar-item-active a { color: white !important; }
        .card { transition: all 0.3s ease; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen antialiased">

    <div id="app" class="flex">
        <aside class="w-64 bg-gray-800 text-gray-400 p-4 flex flex-col h-screen sticky top-0 z-20">
            <div class="logo flex items-center mb-10 mt-2">
                <i class="fa-solid fa-leaf text-2xl text-green-400 mr-2"></i>
                <span class="text-xl font-semibold text-white">CoreUtility</span>
            </div>
            <nav class="flex-1">
                <ul class="space-y-2">
                    <li><a href="index.html" class="flex items-center space-x-3 p-2 text-sm font-medium"><i class="fa-solid fa-house w-5"></i><span>Dashboard</span></a></li>
                    <li><a href="customers.html" class="flex items-center space-x-3 p-2 text-sm font-medium hover:bg-gray-700 hover:text-white rounded-lg transition"><i class="fa-solid fa-user w-5"></i><span>Customers</span></a></li>
                    <li><a href="tariffs.html" class="flex items-center space-x-3 p-2 text-sm font-medium hover:bg-gray-700 hover:text-white rounded-lg transition"><i class="fa-solid fa-wallet w-5"></i><span>Tariffs</span></a></li>
                    <li><a href="reports.html" class="flex items-center space-x-3 p-2 text-sm font-medium hover:bg-gray-700 hover:text-white rounded-lg transition"><i class="fa-solid fa-chart-line w-5"></i><span>Reports</span></a></li>
                    <li><a href="admin.html" class="flex items-center space-x-3 p-2 text-sm font-medium hover:bg-gray-700 hover:text-white rounded-lg transition"><i class="fa-solid fa-gear w-5"></i><span>Administration</span></a></li>
                </ul>
            </nav>
            <div class="mt-auto p-2 border-t border-gray-700 pt-4 text-[10px] text-gray-500 text-center uppercase tracking-widest">
                Sri Lanka Utility v2.0
            </div>
        </aside>
        
        <main class="flex-1 p-6 lg:p-10 overflow-x-hidden">
            <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Operational Dashboard</h1>
                    <p class="text-sm text-gray-500 mt-1">Welcome back. Here is what's happening today.</p>
                </div>
            </header>

            <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">
                <div class="card bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Customers</h3>
                    <div class="flex items-end justify-between mt-2">
                        <div class="text-3xl font-bold text-gray-800">15,450</div>
                        <div class="text-xs font-bold text-green-500 bg-green-50 px-2 py-1 rounded-md">+2.1%</div>
                    </div>
                </div>
                </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-80">
                    <h3 class="text-sm font-bold text-gray-800 mb-6">Revenue Collection Trend</h3>
                    <canvas id="revenueChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center">
                    <h3 class="text-sm font-bold text-gray-800 mb-6 w-full">Usage Distribution</h3>
                    <div class="w-full h-48">
                        <canvas id="usageChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
